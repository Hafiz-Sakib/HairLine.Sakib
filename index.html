<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sakib</title>
    <meta name="description" content="Hafiz Sakib — full-stack developer, competitive programmer and NLP researcher from Chattogram, Bangladesh." />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="theme-color" content="#ffffff" id="theme-color" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sakib" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="Sakib" />

    <meta property="og:title" content="Sakib" />
    <meta property="og:description" content="Full-stack developer, competitive programmer and NLP researcher." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />
    <script>
      /* light by default; dark only if the visitor chose it. Applied before first paint. */
      (function () {
        try {
          var dark = localStorage.getItem("sakib-theme") === "dark";
          if (dark) document.documentElement.classList.add("dark");
          var m = document.getElementById("theme-color");
          if (m) m.setAttribute("content", dark ? "#0a0c14" : "#ffffff");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
